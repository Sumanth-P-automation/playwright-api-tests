name: Playwright API Testing Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 18

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Node Dependencies
      run: npm install

    - name: Quality Gate - Run Smoke API Tests
      run: npm run test:smoke

    - name: Run Full Playwright API Suite
      run: npm test

    - name: Run SQL Data Integrity Checks
      run: python sql/run_checks.py

    - name: Upload Test Report Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: playwright-report/
        retention-days: 14
